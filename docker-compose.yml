services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      # Daily logo re-check at 03:00 (container time). Set to "off" to disable.
      LOGO_CHECK_CRON: "0 3 * * *"
    volumes:
      - ./data:/data # SQLite database
      - ./lineups:/export # exported lineup-<cc>-<slug>.json files
    restart: unless-stopped
